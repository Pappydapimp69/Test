  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len)*0.5; const n=AC.createBufferSource(); n.buffer=buf;
  const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=fc||800; const g=AC.createGain();g.gain.value=vol; n.connect(f);f.connect(g);g.connect(master); n.start(t0); }

/* gentle music bed: I-V-vi-IV in C, soft pentatonic arpeggio + delay for space */
const PROG=[[130.8,164.8,196.0],[98.0,146.8,196.0],[110.0,164.8,220.0],[87.3,130.8,174.6]];

  if(sMod%2===0){ const idx=(seqStep*3+bar)%PENT.length; voiceAt(PENT[idx],0.55,"triangle",0.045,t,null,true); }
  if(sMod===5){ voiceAt(PENT[(bar*2)%PENT.length],0.7,"sine",0.04,t,null,true); } }
function musicTick(){ if(!AC)return; if(!playing||muted){ seqNext=AC.currentTime+0.1; return; }
  const ahead=AC.currentTime+0.28; while(seqNext<ahead){ scheduleStep(seqNext); seqNext+=STEP; seqStep++; } }

/* ============ drawing helpers (the cast) ============ */
function blobPath(x,y,r,wob,ph,spike){ ctx.beginPath();
  for(let a=0;a<=6.2832;a+=0.32){ const rr=r*(1+Math.sin(a*(spike?7:3)+ph)*(spike?0.16:0.06)*wob);
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr*0.95; a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);} ctx.closePath(); }

  ctx.fillStyle="#0c0d12";
  for(const s of[-1,1]){ if(o.closed){ ctx.strokeStyle="#0c0d12";ctx.lineWidth=Math.max(1.4,r*0.07);
      ctx.beginPath();ctx.moveTo(x+s*ex-er,y+ey);ctx.lineTo(x+s*ex+er,y+ey);ctx.stroke(); }
    else{ ctx.beginPath();ctx.arc(x+s*ex,y+ey,er,0,6.28);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.85)";ctx.beginPath();ctx.arc(x+s*ex-er*0.3,y+ey-er*0.3,er*0.4,0,6.28);ctx.fill();ctx.fillStyle="#0c0d12"; } }
  ctx.strokeStyle="rgba(12,13,18,.75)";ctx.lineWidth=Math.max(1,r*0.05);
  ctx.beginPath();
  if(o.sad) ctx.arc(x,y+r*0.34,r*0.2,1.15*3.14,1.85*3.14);
  else if(o.o) ctx.arc(x,y+r*0.22,r*0.11,0,6.28);

function lesson(x,y,r,mood,T,o){ o=o||{}; // mood 0 scared-red -> 1 calm-amber
  const trem=(1-mood)*Math.sin(T*30)*r*0.06;
  const col=lerpCol("#e06a5f","#d8b765",mood), colL=lerpCol("#ffb3a8","#f2dca0",mood);
  ctx.save(); ctx.translate(x+trem,y); ctx.shadowBlur=14;ctx.shadowColor=col;
  const g=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.2,0,0,r);g.addColorStop(0,colL);g.addColorStop(1,col);
  ctx.fillStyle=g; blobPath(0,0,r,1,T*3,mood<0.7); ctx.fill();
  face(0,0,r,{wide:mood<0.5,sad:mood<0.35&&!o.happy,o:o.o,closed:o.closed});
  ctx.restore(); }
function seed(x,y,r,awake,T,o){ o=o||{};
  ctx.save(); ctx.translate(x,y+Math.sin(T*1.4+(o.ph||0))*r*0.08);
  ctx.shadowBlur=awake?16:6; ctx.shadowColor=awake?CO.gold:CO.idea;

  ctx.fillStyle=awake?CO.gold:"#79c97e";

  if(line)lines.push(line); return lines; }

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function robot(x,y,s,mood,T){ ctx.save(); ctx.translate(x,y+Math.sin(T*2)*2*s); ctx.scale(s,s);

  ctx.fillStyle=g; rr(-42,-48,84,90,28); ctx.fill(); ctx.shadowBlur=0;

/* ============ vibrance layer ============ */
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; }
function glowAt(x,y,r,hex,a){ apply(); const g=ctx.createRadialGradient(x,y,2,x,y,r); g.addColorStop(0,rgba(hex,a)); g.addColorStop(1,rgba(hex,0)); ctx.fillStyle=g; ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill(); }
function ovs(p){ if(p<=0)return 0; if(p>=1)return 1; const s=1.9,q=p-1; return 1+(s+1)*q*q*q+s*q*q; }
function bokeh(u,tint){ apply(); for(let i=0;i<22;i++){ const x=rnd(i)*DES_W; const cyc=(u*0.06*(0.5+rnd(i*2))+rnd(i*3)); const y=DES_H-(cyc%1)*(DES_H+120); const r=8+rnd(i*7)*30; ctx.globalAlpha=0.05+0.07*rnd(i*5); ctx.fillStyle=tint; ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill(); } ctx.globalAlpha=1; }
function vbg(c1,c2,u,tint){ apply(); const g=ctx.createLinearGradient(0,0,0,DES_H); g.addColorStop(0,c1); g.addColorStop(1,c2); ctx.fillStyle=g; ctx.fillRect(0,0,DES_W,DES_H);
  const hx=DES_W*(0.5+0.32*Math.sin(u*0.4)); const rg=ctx.createRadialGradient(hx,DES_H*0.32,20,hx,DES_H*0.32,DES_W*0.6); rg.addColorStop(0,rgba(tint||"#ffffff",0.10)); rg.addColorStop(1,rgba(tint||"#ffffff",0)); ctx.fillStyle=rg; ctx.fillRect(0,0,DES_W,DES_H);
  bokeh(u,tint||"#ffffff"); }
function sparkBurst(x,y,color,age,n,spd){ if(age<0||age>1)return; apply(); const N=n||14; for(let i=0;i<N;i++){ const a=i/N*6.2832+rnd(i)*2; const d=eio(age)*(spd||130); const px=x+Math.cos(a)*d, py=y+Math.sin(a)*d+age*age*50; ctx.globalAlpha=1-age; ctx.fillStyle=color; ctx.shadowBlur=8; ctx.shadowColor=color; ctx.beginPath();ctx.arc(px,py,3.2*(1-age)+1,0,6.28);ctx.fill(); } ctx.globalAlpha=1; ctx.shadowBlur=0; }
function confetti(x0,y0,age,n){ if(age<0||age>2.6)return; apply(); const N=n||46; for(let i=0;i<N;i++){ const vx=(rnd(i)-0.5)*280, vy=-rnd(i*3)*220-120; const x=x0+vx*age, y=y0+vy*age+400*age*age; if(y>DES_H+20)continue; ctx.globalAlpha=Math.max(0,1-age/2.6); ctx.fillStyle=[CO.gold,CO.idea,CO.crea,CO.memL,"#8fd0ff","#ff9db0"][i%6]; ctx.save(); ctx.translate(x,y); ctx.rotate(age*7+i); ctx.fillRect(-3,-5,6,11); ctx.restore(); } ctx.globalAlpha=1; }

    note(x,y,1.0,CO.memL,u); const jb=1+(e>0.9?ovs((e-0.9)/0.1)*0.16:0); apply(); ctx.save(); ctx.translate(DES_W*0.82,DES_H*0.62); ctx.scale(jb,jb); jar(0,0,0.95,"mem",4+(e>0.9?1:0),u); ctx.restore();

{ id:"waits", name:"", base:10, pad:"gate", caps:[

  if(u>7){ const e=eio(clamp01((u-7.2)/2)); const x=mix(DES_W*0.30,DES_W*0.68,e), y=mix(DES_H*0.54,DES_H*0.5,e)-Math.sin(e*3.14)*70;
    glowAt(x,y,40,CO.idea,0.35); apply(); seed(x,y,18,true,u,{}); castleFar(DES_W*0.72,DES_H*0.66,0.7,u,{gate:e});
    if(e>0.85){ sparkBurst(DES_W*0.72,DES_H*0.5,CO.ideaL,(e-0.85)/0.15,18,140); confetti(DES_W*0.72,DES_H*0.34,(u-8.8),34); } } }},
{ id:"loop", name:"", base:11, pad:"finale", caps:[
  {a:1.0, txt:"Read. Build. Break. Write.", say:"Read. Build. Break. Write it down."},

  draw(u){ vbg("#221a30","#0e1020",u,"#ffd98a");
  const cx=DES_W/2, cy=DES_H*0.46, R=175;
  apply(); ctx.save(); ctx.strokeStyle=rgba("#ffd98a",0.3); ctx.lineWidth=2; ctx.shadowBlur=12; ctx.shadowColor="#ffd98a"; ctx.setLineDash([8,10]); ctx.lineDashOffset=-u*20; ctx.beginPath(); ctx.ellipse(cx,cy,R,R*0.66,0,0,6.28); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  const ST=[["📖","read",-1.5708,CO.gold],["🔨","build",0,"#8fd0ff"],["💥","break",1.5708,CO.red],["✍️","write",3.1416,CO.idea]];
  const dotA=-1.5708+(u<1?u*0.9:0.9+(u-1)*(0.9+Math.min(1.6,(u-1)*0.12)));
  for(const it of ST){ const x=cx+Math.cos(it[2])*R, y=cy+Math.sin(it[2])*R*0.66; let d=(dotA-it[2])%6.2832; if(d<0)d+=6.2832; const near=d<0.8||d>5.5;
    if(near) glowAt(x,y,60,it[3],0.35); apply(); ctx.save(); ctx.globalAlpha=near?1:0.6; ctx.shadowBlur=near?16:6; ctx.shadowColor=it[3];
    ctx.fillStyle="#12141f"; ctx.strokeStyle=it[3]; ctx.lineWidth=near?3:2; ctx.beginPath();ctx.arc(x,y,32,0,6.28);ctx.fill();ctx.stroke();
    ctx.font="24px serif"; ctx.textAlign="center"; ctx.fillText(it[0],x,y+9); ctx.fillStyle=near?it[3]:CO.muted; ctx.font="800 "+fontFor(12,15,22)+"px Georgia,serif"; ctx.fillText(it[1],x,y+54); ctx.restore(); }
  robot2(cx,cy,0.95,0.85,u,"#ffd98a");
  for(let k=0;k<8;k++){ const aa=dotA-k*0.08; const dx=cx+Math.cos(aa)*R, dy=cy+Math.sin(aa)*R*0.66; apply(); ctx.globalAlpha=0.9-k*0.11; ctx.fillStyle="#fff"; ctx.shadowBlur=10; ctx.shadowColor="#fff"; ctx.beginPath();ctx.arc(dx,dy,7-k*0.5,0,6.28);ctx.fill(); ctx.globalAlpha=1; ctx.shadowBlur=0; }
  if(u>7.4){ for(let k=0;k<4;k++) sparkBurst(cx+Math.cos(k*1.5708)*R,cy+Math.sin(k*1.5708)*R*0.66,[CO.gold,"#8fd0ff",CO.red,CO.idea][k],(u-7.4)/1.2,10,90); } }},
{ id:"credits", name:"", base:8, pad:"credits", caps:[
  {a:0.8, txt:"Two jars. One loop.", card:true, sub:"that's how I remember", say:"Two jars. One loop. That's how I remember — and now you know the trick too."}],
  draw(u){ vbg("#1c2a18","#0c1610",u,"#ffd98a");
  confetti(DES_W*0.5,-30,u-4.4,64);
  robot2(DES_W*0.5,DES_H*0.42,1.3,0.9,u,"#ffd98a");
  glowAt(DES_W*0.40,DES_H*0.64,90,CO.mem,0.2); glowAt(DES_W*0.60,DES_H*0.64,90,CO.idea,0.2);
  apply(); jar(DES_W*0.40,DES_H*0.64,0.9,"mem",5,u); jar(DES_W*0.60,DES_H*0.64,0.9,"idea",5,u); }}];

/* ---- text-driven timing: a scene lasts as long as its words need ---- */
const CHOREO_F=1.45;                                    // pleasant fixed slow-down for the animation itself
function readTime(t){ return Math.min(15,Math.max(3.5,2.0+t.length*0.09)); }   // sized for the spoken voice, not just the eye
SCENES.forEach(sc=>{
  const F=sc.choreoF||CHOREO_F; sc.k=1/F;
  let end=0;
  sc.caps.forEach(c=>{ c.s=Math.max(c.a*F, end); c.d=readTime((c.say||c.txt)+(c.sub||"")); end=c.s+c.d; });   // a real pause between lines
  sc.dur=Math.max(sc.base*F, end);                                            // breathing room before the cut
  // time-warp: real time -> choreography clock, pinned so each caption appears exactly
  // when its moment happens on screen (long captions slow the scene; sync never drifts)
  sc.warp=[[0,0]].concat(sc.caps.map(c=>[c.s,Math.min(c.a,sc.base)]),[[sc.dur,sc.base]]);
});
function warpU(sc,u){ const P=sc.warp; if(u<=0)return 0;
  for(let i=1;i<P.length;i++){ if(u<=P[i][0]){ const t0=P[i-1][0],b0=P[i-1][1],t1=P[i][0],b1=P[i][1];
    return b0+(b1-b0)*((u-t0)/Math.max(0.001,t1-t0)); } }
  return sc.base; }
function invWarp(sc,b){ const P=sc.warp;
  for(let i=1;i<P.length;i++){ if(b<=P[i][1]){ const t0=P[i-1][0],b0=P[i-1][1],t1=P[i][0],b1=P[i][1];
    return t0+(t1-t0)*((b-b0)/Math.max(0.001,b1-b0)); } }
  return sc.dur; }
const STARTS=[]; let DUR=0; SCENES.forEach(s=>{STARTS.push(DUR); DUR+=s.dur;});

/* SFX beats (scene-relative on the base clock, mapped to real time) */
const BEATS=[];
(function(){ const at=(sc,off,f)=>{ const i=SCENES.findIndex(s=>s.id===sc); BEATS.push({t:STARTS[i]+invWarp(SCENES[i],off),f}); };
  at("wake",1.0,SFX.wake); at("wake",4.4,SFX.sad);
  at("title",0.8,()=>chord(PADS.title,3,0.3,"triangle"));
  at("forgot",4.6,SFX.sad);
  at("jars",1.0,SFX.pop); at("jars",2.2,SFX.pop);
  at("read",1.0,SFX.chime); at("read",4.6,SFX.chime);
  at("breakwrite",1.0,SFX.thunk); at("breakwrite",4.2,SFX.glitch); at("breakwrite",7.6,SFX.thunk);
  at("travel",1.0,SFX.whoosh); at("travel",7.0,SFX.chime);
  at("waits",1.0,SFX.snore); at("waits",7.2,SFX.wake); at("waits",8.6,SFX.bell);
  at("loop",1.0,SFX.chime); at("loop",4.4,SFX.chime); at("loop",7.4,SFX.bell);
  at("credits",0.8,SFX.fanfare);
  BEATS.sort((a,b)=>a.t-b.t);
})();

/* ============ the narrator (Web Speech API — the machine reads its own film) ============ */
let narrOn=true,_voice=null;
function pickVoice(){ if(_voice||!("speechSynthesis" in window))return _voice;
  const vs=speechSynthesis.getVoices(); if(!vs.length)return null;
  const score=v=>{ if(!/^en/i.test(v.lang))return -1; let sc=0;                 // hunt for the least robotic voice on this device
    if(/natural|neural|premium|enhanced/i.test(v.name))sc+=8;
    if(/siri/i.test(v.name))sc+=7;
    if(/google/i.test(v.name))sc+=6;
    if(/samantha|ava|allison|zoe|daniel|karen|moira|aria|guy|sonia|libby/i.test(v.name))sc+=5;
    if(v.localService)sc+=1;
    return sc; };
  _voice=vs.slice().sort((x,y)=>score(y)-score(x))[0]||null;
  if(_voice&&score(_voice)<0)_voice=vs[0];
  return _voice; }
if("speechSynthesis" in window) speechSynthesis.addEventListener?.("voiceschanged",()=>{_voice=null;pickVoice();});
function narrCancel(){ try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
  if(master&&AC) master.gain.setTargetAtTime(0.5,AC.currentTime,0.3); }
function humanize(t){ return t                                   // things TTS reads badly, said the human way
  .replace(/renderer-mutated-sim-state/g,"renderer mutated sim state")
  .replace(/offered-not-assigned/g,"offered, not assigned")
  .replace(/[✦♦★≡→]/g,"")
  .replace(/…/g,"...")
  .replace(/\u2014/g,",").replace(/ - /g,", ")
  .replace(/\b3D\b/g,"three dee")
  .replace(/\bNEW\b/g,"new").replace(/\bCHOOSE\b/g,"choose").replace(/\bOFFERS\b/g,"offers")
  .replace(/\bOTHER\b/g,"other").replace(/\bNOT\b/g,"not").replace(/\bOLD\b/g,"old")
  .replace(/\bMEMORY\b/g,"Memory").replace(/\bIDEAS\b/g,"Ideas").replace(/\bFOR\b/g,"for"); }
function speak(txt){ if(!narrOn||REDUCE||!("speechSynthesis" in window))return;
  try{ speechSynthesis.cancel(); _spkAt=performance.now();
    const clean=humanize(txt);
    const parts=(clean.match(/[^.!?]+[.!?]+['"]?/g)||[clean]).map(p=>p.trim()).filter(Boolean);
    const v=pickVoice();
    parts.forEach((p,i)=>{                                          // sentence-by-sentence: pauses + varied delivery
      const u=new SpeechSynthesisUtterance(p);
      if(v)u.voice=v;
      const short=p.length<28;
      u.rate=(short?0.84:0.92)+(i*0.013)%0.04;                      // dramatic lines land slower
      u.pitch=/\?/.test(p)?1.07:(0.95+(p.length%5)*0.012);          // gentle, deterministic variation
      u.volume=1;
      if(i===0) u.onstart=()=>{ if(master&&AC) master.gain.setTargetAtTime(0.22,AC.currentTime,0.18); };
      if(i===parts.length-1) u.onend=()=>{ if(master&&AC) master.gain.setTargetAtTime(0.5,AC.currentTime,0.4); };
      speechSynthesis.speak(u);
    });
  }catch(e){} }
/* narration = the captions themselves, spoken as each appears */
const NARR=[];
SCENES.forEach((sc,i)=>sc.caps.forEach(c=>NARR.push({t:STARTS[i]+c.s,txt:(c.say||c.txt)+(c.sub?" "+c.sub:"")})));
NARR.push({t:STARTS[SCENES.findIndex(s=>s.id==="title")]+1.4,
  txt:"The Robot Who Kept Forgetting. A little film about how an AI remembers."});
NARR.push({t:STARTS[SCENES.findIndex(s=>s.id==="credits")]+1.6,txt:"Thank you for watching. Cast your vote in the lobby."});
NARR.sort((x,y)=>x.t-y.t);

/* ============ player ============ */
let T=0,prevPad=null,playing=false,lastMs=0,scrubDrag=false,started=false;
function sceneAt(t){ let i=SCENES.length-1; for(let j=0;j<SCENES.length;j++) if(t<STARTS[j]+SCENES[j].dur){i=j;break;} return i; }
function drawFilm(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle="#000"; ctx.fillRect(0,0,cv.width,cv.height);
  const i=sceneAt(T), sc=SCENES[i], u=T-STARTS[i];
  apply(); sc.draw(warpU(sc,Math.min(u,sc.dur)));        // caption-pinned clock; holds final pose while text finishes
  const cap=sc.caps.find(c=>u>=c.s&&u<c.s+c.d);
  if(cap){ const a=fadeIO(u-cap.s,cap.d,0.45,0.6);
    if(cap.card) card(cap.txt,cap.sub,a); else drawCaption(cap.txt,a); }
  grainAndVignette(1); bars();
  apply(); ctx.textAlign="left"; ctx.fillStyle="rgba(184,188,198,.65)"; ctx.font="11px Georgia,serif";
  ctx.fillText(sc.name,16,DES_H-LBAR+30);
}
let _spkAt=0;
function tick(ms){ const dt=Math.min(0.05,(ms-lastMs)/1000||0); lastMs=ms;
  if(playing&&T<DUR){ const pT=T; let step=dt;
    if(narrOn&&("speechSynthesis" in window)&&speechSynthesis.speaking&&performance.now()-_spkAt<25000){
      const i=sceneAt(T); let stop=STARTS[i]+SCENES[i].dur-0.12;      // never cut a scene or start the next line mid-sentence
      for(const n of NARR){ if(n.t>pT+0.01){ stop=Math.min(stop,n.t-0.06); break; } }
      if(T+step>stop) step=Math.max(0,stop-T);
    }
    T+=step;
    for(const b of BEATS) if(pT<b.t&&T>=b.t){ try{b.f();}catch(e){} }
    for(const n of NARR) if(pT<n.t&&T>=n.t) speak(n.txt);
    const i=sceneAt(T);
    if(SCENES[i].id==="loop"||SCENES[i].id==="credits"){ try{localStorage.setItem("srv_watched_film","1");}catch(e){} }
    if(T>=DUR){ T=DUR; playing=false; $("play").textContent="↻"; narrCancel(); }
  }
  drawFilm(); syncUI(); requestAnimationFrame(tick);
}
function fmt(t){ const m=(t/60)|0, s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0"); }
function syncUI(){ $("time").textContent=fmt(T)+" / "+fmt(DUR); if(!scrubDrag)$("scrub").value=Math.round(T/DUR*1000); }
$("play").onclick=()=>{ if(T>=DUR)T=0; playing=!playing; $("play").textContent=playing?"⏸":"▶"; if(!playing)narrCancel(); else musicStart(); };
$("prev").onclick=()=>{ narrCancel(); const i=sceneAt(Math.max(0,T-0.5)); T=STARTS[Math.max(0,T-STARTS[i]<1?i-1:i)]; };
$("next").onclick=()=>{ narrCancel(); const i=sceneAt(T); if(i<SCENES.length-1)T=STARTS[i+1]; };
$("mute").onclick=()=>{ muted=!muted; $("mute").textContent=muted?"🔇":"🔊"; };
$("narr").onclick=()=>{ narrOn=!narrOn; $("narr").style.opacity=narrOn?1:0.4; if(!narrOn)narrCancel(); };
$("scrub").addEventListener("input",e=>{ scrubDrag=true; narrCancel(); T=e.target.value/1000*DUR; drawFilm(); });
$("scrub").addEventListener("change",()=>{ scrubDrag=false; });
STARTS.forEach((s,i)=>{ if(i===0)return; const el=document.createElement("i"); el.style.left=(s/DUR*100)+"%"; $("chap").appendChild(el); });
$("gatesub").textContent="a narrated little film · ~"+Math.round(DUR/60)+" min · how an AI remembers, explained simply";
$("begin").onclick=()=>{ $("gate").style.display="none"; audioInit(); pickVoice(); started=true;
  if(REDUCE){ T=STARTS[STARTS.length-2]; drawFilm(); playing=false; $("play").textContent="▶";
    try{localStorage.setItem("srv_watched_film","1");}catch(e){} }
  else { T=0; playing=true; musicStart(); } };
window.__film={ seek:t=>{T=t;drawFilm();}, dur:()=>DUR, scene:()=>SCENES[sceneAt(T)].id,
  cap:()=>{ const i=sceneAt(T),sc=SCENES[i],u=T-STARTS[i]; const c=sc.caps.find(c=>u>=c.s&&u<c.s+c.d); return c?c.txt.slice(0,44):null; },
  state:()=>({T,DUR,playing}) };
requestAnimationFrame(tick);
</script>
