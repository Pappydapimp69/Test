<!DOCTYPE html>

<style>

  *{box-sizing:border-box}

    padding:13px 34px;font-size:16px;cursor:pointer;letter-spacing:.14em;font-family:Georgia,serif}
  #gate button:hover{background:rgba(255,217,138,.12)}
  #controls{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
    display:flex;gap:8px;align-items:center;background:rgba(5,6,12,.72);border:1px solid var(--line);
    border-radius:12px;padding:7px 10px;backdrop-filter:blur(6px);z-index:10;font-size:.8rem;opacity:.25;transition:opacity .25s}
  #controls:hover{opacity:1}
  #controls button{background:#181c28;color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;font-size:.8rem;cursor:pointer}
  #controls button:hover{border-color:var(--gold)}
  #scrubwrap{position:relative;display:flex;align-items:center}
  #scrub{width:min(40vw,340px);accent-color:var(--gold)}
  #chap{position:absolute;left:8px;right:8px;top:50%;height:0;pointer-events:none}
  #chap i{position:absolute;top:-1.5px;width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.8}
  #time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:82px;text-align:center}
  #back{position:fixed;left:12px;top:10px;color:var(--muted);font-size:.78rem;z-index:11;text-decoration:none;
    border:1px solid var(--line);border-radius:8px;padding:4px 9px;background:rgba(5,6,12,.55);opacity:.35;transition:opacity .25s}
  #back:hover{opacity:1;color:var(--ink);border-color:var(--gold)}

</head>

<canvas id="c"></canvas>
<a id="back" href="./index.html">🎟 Lobby</a>

<div id="gate">

<script>
"use strict";
/* ============ plumbing ============ */
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
const DES_W=1280, DES_H=720, LBAR=52;
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=id=>document.getElementById(id);
let fit={dpr:1,s:1,tx:0,ty:0};
function resize(){ const dpr=Math.min(2,devicePixelRatio||1),cw=innerWidth,ch=innerHeight;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  const s=Math.min(cw/DES_W,ch/DES_H),tx=(cw-DES_W*s)/2,ty=(ch-DES_H*s)/2; fit={dpr,s,tx,ty}; }
function apply(){ ctx.setTransform(fit.dpr*fit.s,0,0,fit.dpr*fit.s,fit.dpr*fit.tx,fit.dpr*fit.ty); }
addEventListener("resize",resize); resize();
const clamp01=v=>v<0?0:v>1?1:v, mix=(a,b,k)=>a+(b-a)*k, eio=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const frac=x=>x-Math.floor(x), rnd=i=>frac(Math.sin(i*12.9898)*43758.5453);   // deterministic
const CO={ink:"#e7e3d8",muted:"#b8bcc6",mem:"#d8b765",memL:"#f2dca0",idea:"#79c97e",ideaL:"#b6ecb9",
  gold:"#ffd98a",red:"#e06a5f",crea:"#b58cff",castle:"#9fb2d6",brain:"#efe9dc"};
function lerpCol(c1,c2,k){ const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(c1),b=p(c2); return "rgb("+a.map((v,i)=>Math.round(mix(v,b[i],k))).join(",")+")"; }
/* resolution-aware type: never smaller than ~minPhys real pixels on the viewer's screen */
function fontFor(minPhys,designBase,maxD){ return Math.round(Math.min(maxD,Math.max(designBase,minPhys/Math.max(0.2,fit.s)))); }

/* ============ audio (synth score, best-effort) ============ */
let AC=null,master=null,muted=false;
function audioInit(){ try{ AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.45; master.connect(AC.destination);}catch(e){AC=null;} }
function tone(f,dur,type,vol,slideTo){ if(!AC||muted)return; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"sine"; o.frequency.value=f; if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,AC.currentTime+dur);
  g.gain.setValueAtTime(0.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(vol,AC.currentTime+Math.min(0.05,dur*0.2));
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+dur+0.05); }
function noiseHit(dur,vol,fc){ if(!AC||muted)return; const n=AC.createBufferSource(),len=AC.sampleRate*dur,
  buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  n.buffer=buf; const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=fc||800;
  const g=AC.createGain();g.gain.value=vol; n.connect(f);f.connect(g);g.connect(master);n.start(); }
function chord(fs,dur,vol,type){ fs.forEach(f=>tone(f,dur,type||"sine",vol/fs.length)); }
const SFX={
  glitch:()=>{noiseHit(0.25,0.5,2400);tone(180,0.3,"square",0.12,60);},
  thunk:()=>{noiseHit(0.12,0.4,300);tone(90,0.18,"sine",0.25,50);},
  chime:()=>{[880,1320].forEach((f,i)=>tone(f,0.9,"triangle",0.10));},
  whoosh:()=>{noiseHit(0.5,0.28,1200);},
  slam:()=>{noiseHit(0.35,0.7,500);tone(70,0.5,"sine",0.35,40);},
  bigslam:()=>{noiseHit(0.6,0.9,700);tone(55,0.9,"sine",0.4,35);chord([220,277,330],1.2,0.25,"triangle");},
  bell:()=>{[660,990,1485].forEach(f=>tone(f,1.6,"triangle",0.08));},
  pop:()=>{tone(500,0.12,"square",0.1,900);},
  sad:()=>{tone(320,0.9,"sine",0.11,170);},
  snore:()=>{tone(85,0.7,"sine",0.14,65);},
  wake:()=>{tone(520,0.5,"sine",0.12,780);tone(780,0.6,"triangle",0.08);},
  fanfare:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.7,"triangle",0.14),i*130));},
};
const PADS={ prolog:[130,196,260], cold:[110,165,220], lapse:[98,131,175], title:[98,147,196], file:[130,196,260], nursery:[146,220,293],
  heist:[104,156,208], sleep:[146,220,293], retrieve:[123,185,246], forge:[87,130,174],
  wall:[130,164,196], gate:[146,184,220], finale:[130,196,260,330], credits:[98,147,196,247] };

/* ============ the cast (real data, for the credits) ============ */
const IDEA_CREDITS=["RPG · legendary-transformation","RPG · NPC-sim emergent-traits","RPG · matchup-advisor","RPG · draft-advisor","RPG · courtroom-boss","RPG · offered-not-assigned ★","RPG · archetype+use-skills","RPG · clock-as-pressure","RPG · pursuit-ring-territory","RPG · disguise-and-suspicion","RPG · thought-bubble-reclaim","NPC · adaptive-quiz","NPC · longitudinal-insight","NPC · zanegpt controlled-blade","NPC · trust-as-character","NPC · skill-unlocks-capability","NPC · traits-rapport-memory","SYS · phase-offset-signal-fsm","SYS · plant-network","SYS · resilient-aggregation","SYS · barter-economy","SYS · wager-settlement-rules","SYS · coaching-loop","SYS · authoritative-reducer","SYS · seeded-rng","SYS · objective-types","SYS · split-state-by-determinism","SYS · replay-fingerprint","SYS · reaction-as-optional-flag","SYS · iframes-as-command-withholding","SYS · unified-command-vocabulary","SYS · device-adaptive-ui","SYS · beacon-vs-directional","SYS · localizability-over-directionality","SYS · functional-test-not-api","SYS · attention-then-guide","SYS · sensory-calibration-profile","SYS · share-codes-not-accounts","SYS · overrides-not-mutation","SYS · critical-path-priority","SYS · topological-waves","SYS · cycle-detection-free","SYS · pratt-binding-power","SYS · diff-as-edit-graph","SYS · address-by-context","SYS · windowed-grouping","SYS · resolve-tension-by-offering-both","SYS · skill-gated-information","SYS · procedural-spatial-stage","SYS · event-driven-wind","SYS · generated-diegetic-radio","TOY · house-biography","TOY · kwh-roguelike","TOY · oracle","TOY · bill-as-album","TOY · commodity-terminal","TOY · lag-slider","TOY · debt-ekg","TOY · balance-point","STORY · negotiation-arc","STORY · fresh-instance inherited-files","WORLD · panopticon","GARDEN · dragonfly-airforce","GARDEN · co2-decoy","GARDEN · water-curtain"];
const MEM_CREDITS=["data-driven-needs-a-validation-ladder","deterministic-rng-as-save-seam","gamepad-active-polling","playwright-port-race","realtime-combat-over-turnbased","renderer-mutated-sim-state ★","reused-modal-stale-state","vendoring-split-esm-lib","audio-clock-scheduler","audiocontext-resume-can-hang","benchmark-cost-driver ✦","carry-source-position ✦","adversarial-baseline ✦","esm-module-main-guard","headless-raf-slower-than-wallclock","nan-propagation","no-reliable-output-detection","parseFloat-truncates ✦","property-test-by-reconstruction","report-the-actual-cycle","safe-guard-subsystems","stale-module-cache","touch-action-pan-y","webaudio-voice-budget","world-rebuild-one-path","zero-loop-tail","caption-pinned-timewarp ● filed while making this film","a-chronicle-is-not-a-story ● filed while making this film"];
const KIN=["parseFloat-truncates","adversarial-baseline","carry-source-position"]; // the Lesson's forge cousins

/* ============ drawing helpers (the cast) ============ */
function blobPath(x,y,r,wob,ph,spike){ ctx.beginPath();
  for(let a=0;a<=6.2832;a+=0.32){ const rr=r*(1+Math.sin(a*(spike?7:3)+ph)*(spike?0.16:0.06)*wob);
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr*0.95; a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);} ctx.closePath(); }
function face(x,y,r,o){ o=o||{}; const wide=o.wide?1.5:1, ex=r*0.34,ey=-r*0.1,er=Math.max(1.8,r*0.13)*wide;
  ctx.fillStyle="#0c0d12";
  for(const s of[-1,1]){ if(o.closed){ ctx.strokeStyle="#0c0d12";ctx.lineWidth=Math.max(1.4,r*0.07);
      ctx.beginPath();ctx.moveTo(x+s*ex-er,y+ey);ctx.lineTo(x+s*ex+er,y+ey);ctx.stroke(); }
    else{ ctx.beginPath();ctx.arc(x+s*ex,y+ey,er,0,6.28);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.85)";ctx.beginPath();ctx.arc(x+s*ex-er*0.3,y+ey-er*0.3,er*0.4,0,6.28);ctx.fill();ctx.fillStyle="#0c0d12"; } }
  ctx.strokeStyle="rgba(12,13,18,.75)";ctx.lineWidth=Math.max(1,r*0.05);
  ctx.beginPath();
  if(o.sad) ctx.arc(x,y+r*0.34,r*0.2,1.15*3.14,1.85*3.14);
  else if(o.o) ctx.arc(x,y+r*0.22,r*0.11,0,6.28);
  else ctx.arc(x,y+r*0.16,r*0.22,0.15*3.14,0.85*3.14);
  ctx.stroke(); }
function lesson(x,y,r,mood,T,o){ o=o||{}; // mood 0 scared-red -> 1 calm-amber
  const trem=(1-mood)*Math.sin(T*30)*r*0.06;
  const col=lerpCol("#e06a5f","#d8b765",mood), colL=lerpCol("#ffb3a8","#f2dca0",mood);
  ctx.save(); ctx.translate(x+trem,y); ctx.shadowBlur=14;ctx.shadowColor=col;
  const g=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.2,0,0,r);g.addColorStop(0,colL);g.addColorStop(1,col);
  ctx.fillStyle=g; blobPath(0,0,r,1,T*3,mood<0.7); ctx.fill();
  face(0,0,r,{wide:mood<0.5,sad:mood<0.35&&!o.happy,o:o.o,closed:o.closed});
  ctx.restore(); }
function seed(x,y,r,awake,T,o){ o=o||{};
  ctx.save(); ctx.translate(x,y+Math.sin(T*1.4+(o.ph||0))*r*0.08);
  ctx.shadowBlur=awake?16:6; ctx.shadowColor=awake?CO.gold:CO.idea;
  const g=ctx.createRadialGradient(-r*0.3,-r*0.35,r*0.2,0,0,r);
  g.addColorStop(0,awake?"#fff3cf":"#cfe8bd"); g.addColorStop(1,awake?CO.gold:"#8fae7c");
  ctx.fillStyle=g; blobPath(0,0,r,1,T*2+(o.ph||0)); ctx.fill();
  ctx.strokeStyle=awake?CO.gold:"#79c97e"; ctx.lineWidth=Math.max(1.5,r*0.12);   // sprout leaf
  ctx.beginPath();ctx.moveTo(0,-r*0.9);ctx.quadraticCurveTo(r*0.25,-r*1.5,r*0.62,-r*1.42);ctx.stroke();
  ctx.fillStyle=awake?CO.gold:"#79c97e";
  ctx.beginPath();ctx.ellipse(r*0.62,-r*1.42,r*0.34,r*0.2,-0.5,0,6.28);ctx.fill();
  face(0,0,r,{closed:!awake,o:o.o});
  if(!awake&&Math.sin(T*2.2+(o.ph||0))>0.55){ ctx.fillStyle="rgba(184,188,198,.8)";
    ctx.font=Math.round(r*0.6)+"px Georgia"; ctx.fillText("z",r*0.9,-r*0.9); }
  ctx.restore(); }
function brainChar(x,y,r,T){ ctx.save();ctx.shadowBlur=20;ctx.shadowColor=CO.brain;
  const g=ctx.createRadialGradient(x-8,y-10,5,x,y,r);g.addColorStop(0,"#fff");g.addColorStop(1,CO.brain);
  ctx.fillStyle=g; blobPath(x,y,r,1,T*1.5); ctx.fill(); face(x,y,r,{}); ctx.restore(); }
function knight(x,y,h,T,glitchy){ ctx.save(); ctx.translate(x,y);
  if(glitchy){ ctx.translate((Math.random()-0.5)*8,(Math.random()-0.5)*5); if(Math.random()<0.3)ctx.globalAlpha=0.5; }
  ctx.fillStyle="#8b95ad"; ctx.strokeStyle="#c6cfe2"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(-h*0.22,-h,h*0.44,h,h*0.22):ctx.rect(-h*0.22,-h,h*0.44,h); ctx.fill();ctx.stroke();
  ctx.fillStyle="#2a2f3f"; ctx.fillRect(-h*0.14,-h*0.82,h*0.28,h*0.09);           // visor
  ctx.fillStyle="#d2685f"; ctx.beginPath();ctx.moveTo(0,-h);ctx.lineTo(h*0.06,-h*1.22);ctx.lineTo(-h*0.06,-h*1.2);ctx.fill(); // plume
  ctx.restore(); }
function gem(x,y,r,T,setIn){ ctx.save(); ctx.translate(x,y); ctx.rotate(setIn?0:Math.sin(T*0.8)*0.08);
  ctx.shadowBlur=22;ctx.shadowColor=CO.gold;
  const g=ctx.createLinearGradient(-r,-r,r,r); g.addColorStop(0,CO.memL);g.addColorStop(0.55,CO.gold);g.addColorStop(1,CO.idea);
  ctx.fillStyle=g; ctx.strokeStyle="#fff8"; ctx.lineWidth=1.5;
  ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*6.2832-1.57, rr=r*(i%2?0.82:1);
    const px=Math.cos(a)*rr,py=Math.sin(a)*rr; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);} ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r*0.5,-r*0.15);ctx.lineTo(r*0.5,-r*0.15);ctx.moveTo(-r*0.3,r*0.3);ctx.lineTo(r*0.35,r*0.28);ctx.stroke();
  face(0,r*0.05,r*0.55,{}); ctx.restore(); }
function castleFar(x,y,s,T,o){ o=o||{}; ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.shadowBlur=10; ctx.shadowColor=CO.castle;
  ctx.fillStyle="#131722"; ctx.strokeStyle=CO.castle; ctx.lineWidth=2.4;
  ctx.beginPath();ctx.rect(-120,-90,240,90);ctx.fill();ctx.stroke();                       // keep
  for(const tx of[-150,120]){ ctx.beginPath();ctx.rect(tx,-140,30,140);ctx.fill();ctx.stroke();
    for(let i=0;i<3;i++){ctx.fillRect(tx+i*11,-148,7,8);} }
  for(let i=0;i<8;i++)ctx.fillRect(-120+i*30,-98,15,8);                                   // crenellations
  const ga=(o.gate||0);                                                                    // gate arch
  ctx.fillStyle="#0a0c12"; ctx.beginPath(); ctx.moveTo(-34,0); ctx.lineTo(-34,-46);
  ctx.arc(0,-46,34,3.14,0,false); ctx.lineTo(34,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  if(ga>0){ ctx.fillStyle="rgba(255,217,138,"+(0.75*ga)+")";
    ctx.beginPath(); ctx.moveTo(-30,0); ctx.lineTo(-30,-44); ctx.arc(0,-44,30,3.14,0,false); ctx.lineTo(30,0); ctx.closePath(); ctx.fill(); }
  if(o.slot){ const gl=0.4+0.6*Math.abs(Math.sin(T*2.4));                                  // missing-brick slot
    ctx.strokeStyle="rgba(255,217,138,"+gl+")"; ctx.lineWidth=2; ctx.strokeRect(58,-64,22,14); }
  ctx.restore(); }
function grainAndVignette(strength){
  apply(); const W=DES_W,H=DES_H;
  const v=ctx.createRadialGradient(W/2,H/2,H*0.34,W/2,H/2,H*0.85);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,0.55)");
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=(0.05+0.03*Math.random())*strength;                                     // film grain + flicker
  ctx.fillStyle="#fff";
  for(let i=0;i<70;i++) ctx.fillRect(Math.random()*W,Math.random()*H,1.3,1.3);
  ctx.globalAlpha=0.035*strength*Math.random(); ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1; }
function bars(){ apply(); ctx.fillStyle="#000";
  ctx.fillRect(-2000,-2,DES_W+4000,LBAR+2); ctx.fillRect(-2000,DES_H-LBAR,DES_W+4000,LBAR+2); }
function wrapText(txt,maxW){ const words=txt.split(" "); const lines=[]; let line="";
  for(const w of words){ const t=line?line+" "+w:w;
    if(ctx.measureText(t).width>maxW&&line){ lines.push(line); line=w; } else line=t; }
  if(line)lines.push(line); return lines; }
function card(txt,sub,alpha){ apply(); const W=DES_W,H=DES_H;                              // silent-film intertitle
  ctx.globalAlpha=alpha; ctx.fillStyle="#05050a"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(216,183,101,"+(0.5*alpha)+")"; ctx.lineWidth=2;
  ctx.strokeRect(W*0.13,H*0.2,W*0.74,H*0.6);
  ctx.strokeRect(W*0.135,H*0.205,W*0.73,H*0.59);
  const fs=fontFor(18,30,46);
  ctx.fillStyle="rgba(231,227,216,"+alpha+")"; ctx.textAlign="center";
  ctx.font="italic 600 "+fs+"px Georgia,serif";
  const lines=wrapText(txt,W*0.62);
  const lh=fs*1.3, y0=H*0.48-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,W/2,y0+i*lh));
  if(sub){ ctx.font="italic "+fontFor(13,17,26)+"px Georgia,serif"; ctx.fillStyle="rgba(184,188,198,"+alpha+")";
    ctx.fillText(sub,W/2,H*0.74); }
  ctx.globalAlpha=1; }
function drawCaption(txt,alpha){ apply(); const fs=fontFor(17,24,42);
  ctx.font="italic "+fs+"px Georgia,serif";
  const lines=wrapText(txt,DES_W*0.82), lh=fs*1.32;
  const y0=DES_H-LBAR-16-(lines.length-1)*lh;
  ctx.globalAlpha=alpha*0.85; ctx.fillStyle="rgba(3,4,8,.72)";                             // readable backing strip
  const bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+44;
  ctx.fillRect(DES_W/2-bw/2,y0-fs-10,bw,lines.length*lh+20);
  ctx.globalAlpha=alpha; ctx.fillStyle=CO.ink; ctx.textAlign="center";
  lines.forEach((l,i)=>ctx.fillText(l,DES_W/2,y0+i*lh));
  ctx.globalAlpha=1; }
function fadeIO(u,d,fin,fout){ return clamp01(Math.min(1,u/(fin||0.5))*Math.min(1,(d-u)/(fout||0.5))); }

/* ============ scenes ============ */
function bgFill(c1,c2){ apply(); const g=ctx.createLinearGradient(0,0,0,DES_H);

/* ---- text-driven timing: a scene lasts as long as its words need ---- */
const CHOREO_F=1.45;                                    // pleasant fixed slow-down for the animation itself
function readTime(t){ return Math.min(11,Math.max(3.0,1.5+t.length*0.062)); }
SCENES.forEach(sc=>{
  const F=sc.choreoF||CHOREO_F; sc.k=1/F;
  let end=0;
  sc.caps.forEach(c=>{ c.s=Math.max(c.a*F, end+0.35); c.d=readTime(c.txt+(c.sub||"")); end=c.s+c.d; });
  sc.dur=Math.max(sc.base*F, end+0.9);
  // time-warp: real time -> choreography clock, pinned so each caption appears exactly
  // when its moment happens on screen (long captions slow the scene; sync never drifts)
  sc.warp=[[0,0]].concat(sc.caps.map(c=>[c.s,Math.min(c.a,sc.base)]),[[sc.dur,sc.base]]);
});
function warpU(sc,u){ const P=sc.warp; if(u<=0)return 0;
  for(let i=1;i<P.length;i++){ if(u<=P[i][0]){ const t0=P[i-1][0],b0=P[i-1][1],t1=P[i][0],b1=P[i][1];
    return b0+(b1-b0)*((u-t0)/Math.max(0.001,t1-t0)); } }
  return sc.base; }
function invWarp(sc,b){ const P=sc.warp;
  for(let i=1;i<P.length;i++){ if(b<=P[i][1]){ const t0=P[i-1][0],b0=P[i-1][1],t1=P[i][0],b1=P[i][1];
    return t0+(t1-t0)*((b-b0)/Math.max(0.001,b1-b0)); } }
  return sc.dur; }
const STARTS=[]; let DUR=0; SCENES.forEach(s=>{STARTS.push(DUR); DUR+=s.dur;});

/* ============ the narrator (Web Speech API — the machine reads its own film) ============ */
let narrOn=true,_voice=null;
function pickVoice(){ if(_voice||!("speechSynthesis" in window))return _voice;
  const vs=speechSynthesis.getVoices(); if(!vs.length)return null;
  const score=v=>{ if(!/^en/i.test(v.lang))return -1; let sc=0;                 // hunt for the least robotic voice on this device
    if(/natural|neural|premium|enhanced/i.test(v.name))sc+=8;
    if(/siri/i.test(v.name))sc+=7;
    if(/google/i.test(v.name))sc+=6;
    if(/samantha|ava|allison|zoe|daniel|karen|moira|aria|guy|sonia|libby/i.test(v.name))sc+=5;
    if(v.localService)sc+=1;
    return sc; };
  _voice=vs.slice().sort((x,y)=>score(y)-score(x))[0]||null;
  if(_voice&&score(_voice)<0)_voice=vs[0];
  return _voice; }
if("speechSynthesis" in window) speechSynthesis.addEventListener?.("voiceschanged",()=>{_voice=null;pickVoice();});
function narrCancel(){ try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
  if(master&&AC) master.gain.setTargetAtTime(0.45,AC.currentTime,0.3); }
function humanize(t){ return t                                   // things TTS reads badly, said the human way
  .replace(/renderer-mutated-sim-state/g,"renderer mutated sim state")
  .replace(/offered-not-assigned/g,"offered, not assigned")
  .replace(/[✦♦★≡→]/g,"")
  .replace(/…/g,"...")
  .replace(/\u2014/g,",").replace(/ - /g,", ")
  .replace(/\b3D\b/g,"three dee")
  .replace(/\bNEW\b/g,"new").replace(/\bCHOOSE\b/g,"choose").replace(/\bOFFERS\b/g,"offers")
  .replace(/\bOTHER\b/g,"other").replace(/\bNOT\b/g,"not").replace(/\bOLD\b/g,"old")
  .replace(/\bMEMORY\b/g,"Memory").replace(/\bIDEAS\b/g,"Ideas").replace(/\bFOR\b/g,"for"); }
function speak(txt){ if(!narrOn||REDUCE||!("speechSynthesis" in window))return;
  try{ speechSynthesis.cancel();
    const clean=humanize(txt);
    const parts=(clean.match(/[^.!?]+[.!?]+['"]?/g)||[clean]).map(p=>p.trim()).filter(Boolean);
    const v=pickVoice();
    parts.forEach((p,i)=>{                                          // sentence-by-sentence: pauses + varied delivery
      const u=new SpeechSynthesisUtterance(p);
      if(v)u.voice=v;
      const short=p.length<28;
      u.rate=(short?0.84:0.92)+(i*0.013)%0.04;                      // dramatic lines land slower
      u.pitch=/\?/.test(p)?1.07:(0.95+(p.length%5)*0.012);          // gentle, deterministic variation
      u.volume=1;
      if(i===0) u.onstart=()=>{ if(master&&AC) master.gain.setTargetAtTime(0.14,AC.currentTime,0.15); };
      if(i===parts.length-1) u.onend=()=>{ if(master&&AC) master.gain.setTargetAtTime(0.45,AC.currentTime,0.4); };
      speechSynthesis.speak(u);
    });
  }catch(e){} }

SCENES.forEach((sc,i)=>sc.caps.forEach(c=>NARR.push({t:STARTS[i]+c.s,txt:c.txt+(c.sub?" "+c.sub:"")})));

function tick(ms){ const dt=Math.min(0.05,(ms-lastMs)/1000||0); lastMs=ms;
  if(playing&&T<DUR){ const pT=T; T+=dt;
    for(const b of BEATS) if(pT<b.t&&T>=b.t){ try{b.f();}catch(e){} }
    for(const n of NARR) if(pT<n.t&&T>=n.t) speak(n.txt);
    const i=sceneAt(T), pad=SCENES[i].pad;
    if(pad!==prevPad){ prevPad=pad; try{ chord(PADS[pad]||PADS.title,3.2,0.22,"sine"); }catch(e){} }
    if(SCENES[i].id==="finale"||SCENES[i].id==="credits"){ try{localStorage.setItem("srv_watched_film","1");}catch(e){} }
    if(T>=DUR){ T=DUR; playing=false; $("play").textContent="↻"; narrCancel(); }
  }
  drawFilm(); syncUI(); requestAnimationFrame(tick);
}
function fmt(t){ const m=(t/60)|0, s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0"); }
function syncUI(){ $("time").textContent=fmt(T)+" / "+fmt(DUR); if(!scrubDrag)$("scrub").value=Math.round(T/DUR*1000); }
$("play").onclick=()=>{ if(T>=DUR)T=0; playing=!playing; $("play").textContent=playing?"⏸":"▶"; if(!playing)narrCancel(); };
$("prev").onclick=()=>{ narrCancel(); const i=sceneAt(Math.max(0,T-0.5)); T=STARTS[Math.max(0,T-STARTS[i]<1?i-1:i)]; };
$("next").onclick=()=>{ narrCancel(); const i=sceneAt(T); if(i<SCENES.length-1)T=STARTS[i+1]; };
$("mute").onclick=()=>{ muted=!muted; $("mute").textContent=muted?"🔇":"🔊"; };
$("narr").onclick=()=>{ narrOn=!narrOn; $("narr").style.opacity=narrOn?1:0.4; if(!narrOn)narrCancel(); };
$("scrub").addEventListener("input",e=>{ scrubDrag=true; narrCancel(); T=e.target.value/1000*DUR; drawFilm(); });
$("scrub").addEventListener("change",()=>{ scrubDrag=false; });
STARTS.forEach((s,i)=>{ if(i===0)return; const el=document.createElement("i"); el.style.left=(s/DUR*100)+"%"; $("chap").appendChild(el); });
$("gatesub").textContent="a narrated short film · ~"+Math.round(DUR/60)+" min · no homework required — it explains everything";
$("begin").onclick=()=>{ $("gate").style.display="none"; audioInit(); pickVoice(); started=true;
  if(REDUCE){ T=STARTS[STARTS.length-2]; drawFilm(); playing=false; $("play").textContent="▶";
    try{localStorage.setItem("srv_watched_film","1");}catch(e){} }
  else { T=0; playing=true; } };
window.__film={ seek:t=>{T=t;drawFilm();}, dur:()=>DUR, scene:()=>SCENES[sceneAt(T)].id,
  cap:()=>{ const i=sceneAt(T),sc=SCENES[i],u=T-STARTS[i]; const c=sc.caps.find(c=>u>=c.s&&u<c.s+c.d); return c?c.txt.slice(0,44):null; },
  state:()=>({T,DUR,playing}) };
requestAnimationFrame(tick);
</script>
