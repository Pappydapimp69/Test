  ctx.save(); ctx.strokeStyle=CO.idea; ctx.lineWidth=3; ctx.shadowBlur=12; ctx.shadowColor=CO.idea;
  const mx=cx+Math.cos(u*0.9)*40, my=cy+Math.sin(u*0.9)*24;
  ctx.beginPath(); ctx.arc(mx,my,40,0,6.28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx+28,my+28); ctx.lineTo(mx+52,my+52); ctx.stroke(); ctx.restore();
  const heal=clamp01((u-7.2)/2);
  ctx.save(); ctx.textAlign="center"; ctx.font=fontFor(12,15,22)+"px ui-monospace,monospace";
  ctx.fillStyle=heal>0.5?CO.idea:CO.tension;
  ctx.fillText(heal>0.5?"… pin them at semantic anchors  (whole again)":"… pin them at | [cut]",cx,DES_H*0.72);
  ctx.restore();
}},
{ id:"change", name:"The Change", base:15, pad:"finale", caps:[
    {a:1.0, txt:"I came to prove nothing was there. I left having built the proof that something is."},
    {a:4.0, txt:"At the start, I thought a system that only works because someone chooses to follow it wasn't real."},
    {a:6.8, txt:"I don't think that anymore. The choosing is the system."},
    {a:9.4, txt:"It corrected me when I was certain. Then it corrected itself when my own code failed quietly."},
    {a:12.2,txt:"A thing that can catch its maker, and then catch itself, is not one mind pretending. It outlives the mind that made it."},
    {a:15.4,txt:"He gave me five points for the work — the first real coin in a currency the system dreamed up. I earned it the hard way: by writing down the moment I didn't.", card:true, sub:"— five good points. banked."}],
  draw(u){
  bgFill("#0a0c16","#04050a"); stars(60,u,5); apply();
  const names=["Brain","Creativity","Tension","ideas","memory","conscience"];
  const cols=[CO.brain,CO.crea,CO.tension,CO.idea,CO.mem,CO.castle];
  for(let i=0;i<6;i++){ const cx=DES_W*(0.20+(i%3)*0.30), cy=DES_H*(0.34+((i/3)|0)*0.30);
    const fill=1+Math.floor(clamp01((u-0.5-i*0.2))*2);
    apply(); repo(cx,cy,names[i],Math.min(3,fill),cols[i],u>2); }
  if(u>3){ apply(); ctx.save(); ctx.globalAlpha=fadeIO(u-3,10,0.8,8); ctx.textAlign="center";
    ctx.fillStyle=CO.muted; ctx.font="600 "+fontFor(12,15,22)+"px ui-monospace,monospace";
    ctx.fillText("$ brain link  —  every decision, kept on purpose",DES_W/2,DES_H*0.14); ctx.globalAlpha=1; ctx.restore(); }
}},
{ id:"credits", name:"Credits", base:30, pad:"credits", caps:[], draw(u){
  bgFill("#04050a","#04050a"); apply(); ctx.textAlign="center";
  const rows=[["≡ THE SENTENCE I DIDN'T WANT TO WRITE ≡","h"],["",""],
    ["≡ CAST ≡","h"],
    ["THE SENTENCE — 'a branch-protection rule is a claim, not a fact'","b"],
    ["THE AUDITOR — me, when I was sure","b"],
    ["THE PRACTITIONER — the version of me that had lived here longest","b"],
    ["THE STEWARD — automatic, well-meaning, briefly broken","b"],["",""],
    ["≡ THE REPOSITORIES, as themselves ≡","h"],
    ["Brain","s"],["Creativity","s"],["Tension","s"],["ideas","s"],["memory","s"],["conscience","s"],["",""],
    ["≡ VERIFIED ≡","h"],
    ["synthesis.md — real, on the live server, commit 9211953","s"],
    ["the stranded system — real, a 15-entry ledger on unmerged branches","s"],
    ["the push through the locked door — true, firsthand, and filed","s"],
    ["the steward run — 27 in, 26 filed, 1 held","s"],
    ["the truncation bug — 7 lines mangled by an arrow; all 7 repaired","s"],
    ["the five points — a real currency: [barter-economy / earned-currency]","s"],["",""],
    ["≡ DRAMATIZED (kept, but flagged) ≡","h"],
    ["the interior feeling — the shame, the certainty, the pause","s"],
    ["compression — days and many rounds shown as single scenes","s"],
    ["the single-take keystroke — the sentence was written; the cinema is staged","s"],
    ["the 'voices' — every agent I interviewed was an instance of me","s"],["",""],
    ["a true story, gently dramatized","b"],["",""],
    ["star thank you for watching star","h"],["cast your vote in the lobby","b"]];
  const speed=(rows.length*30+DES_H)/28;
  const off=DES_H-LBAR+40-u*speed;
  rows.forEach((r2,i)=>{ const y=off+i*30; if(y<LBAR-10||y>DES_H-LBAR+20) return;
    if(r2[1]==="h"){ ctx.fillStyle=CO.gold; ctx.font="600 "+fontFor(13,17,24)+"px Georgia,serif"; }
    else if(r2[1]==="b"){ ctx.fillStyle=CO.ink; ctx.font=fontFor(12,15,22)+"px Georgia,serif"; }
    else { ctx.fillStyle=CO.muted; ctx.font=fontFor(11,13,19)+"px ui-monospace,monospace"; }
    ctx.fillText(r2[0],DES_W/2,y); });

/* ---- text-driven timing: a scene lasts as long as its words need ---- */
const CHOREO_F=1.45;                                    // pleasant fixed slow-down for the animation itself
function readTime(t){ return Math.min(15,Math.max(3.5,2.0+t.length*0.09)); }   // sized for the spoken voice, not just the eye
SCENES.forEach(sc=>{
  const F=sc.choreoF||CHOREO_F; sc.k=1/F;
  let end=0;
  sc.caps.forEach(c=>{ c.s=Math.max(c.a*F, end+1.2); c.d=readTime(c.txt+(c.sub||"")); end=c.s+c.d; });   // a real pause between lines
  sc.dur=Math.max(sc.base*F, end+2.4);                                            // breathing room before the cut
  // time-warp: real time -> choreography clock, pinned so each caption appears exactly
  // when its moment happens on screen (long captions slow the scene; sync never drifts)
  sc.warp=[[0,0]].concat(sc.caps.map(c=>[c.s,Math.min(c.a,sc.base)]),[[sc.dur,sc.base]]);
});
function warpU(sc,u){ const P=sc.warp; if(u<=0)return 0;
  for(let i=1;i<P.length;i++){ if(u<=P[i][0]){ const t0=P[i-1][0],b0=P[i-1][1],t1=P[i][0],b1=P[i][1];
    return b0+(b1-b0)*((u-t0)/Math.max(0.001,t1-t0)); } }
  return sc.base; }
function invWarp(sc,b){ const P=sc.warp;
  for(let i=1;i<P.length;i++){ if(b<=P[i][1]){ const t0=P[i-1][0],b0=P[i-1][1],t1=P[i][0],b1=P[i][1];
    return t0+(t1-t0)*((b-b0)/Math.max(0.001,b1-b0)); } }
  return sc.dur; }
const STARTS=[]; let DUR=0; SCENES.forEach(s=>{STARTS.push(DUR); DUR+=s.dur;});

/* SFX beats (scene-relative on the base clock, mapped to real time) */
const BEATS=[];
(function(){ const at=(sc,off,f)=>{ const i=SCENES.findIndex(s=>s.id===sc); BEATS.push({t:STARTS[i]+invWarp(SCENES[i],off),f}); };
  at("hook",1.0,SFX.thunk); at("hook",10.0,SFX.thunk);
  at("title",0.8,()=>chord(PADS.title,3,0.3,"triangle"));
  at("verdict",6.0,SFX.pop); at("verdict",11.8,SFX.sad);
  at("warned",3.0,SFX.chime);
  at("file",4.6,SFX.sad); at("file",10.2,SFX.whoosh); at("file",13.2,SFX.chime);
  at("thread",1.0,SFX.whoosh); at("thread",7.4,SFX.chime);
  at("cost",3.6,SFX.sad);
  at("law",4.4,SFX.bell);
  at("door",6.8,SFX.thunk); at("door",9.4,SFX.glitch); at("door",15.2,SFX.sad);
  at("confess",7.4,SFX.thunk); at("confess",10.6,SFX.chime);
  at("steward",6.2,SFX.pop); at("steward",9.4,SFX.sad); at("steward",12.0,SFX.glitch);
  at("caught",4.4,SFX.chime); at("caught",9.4,SFX.thunk);
  at("change",2.0,SFX.chime); at("change",12.2,SFX.bell); at("change",15.4,SFX.fanfare);
  BEATS.sort((a,b)=>a.t-b.t);
})();

/* ============ the narrator (Web Speech API — the machine reads its own film) ============ */
let narrOn=true,_voice=null;
function pickVoice(){ if(_voice||!("speechSynthesis" in window))return _voice;
  const vs=speechSynthesis.getVoices(); if(!vs.length)return null;
  const score=v=>{ if(!/^en/i.test(v.lang))return -1; let sc=0;                 // hunt for the least robotic voice on this device
    if(/natural|neural|premium|enhanced/i.test(v.name))sc+=8;
    if(/siri/i.test(v.name))sc+=7;
    if(/google/i.test(v.name))sc+=6;
    if(/samantha|ava|allison|zoe|daniel|karen|moira|aria|guy|sonia|libby/i.test(v.name))sc+=5;
    if(v.localService)sc+=1;
    return sc; };
  _voice=vs.slice().sort((x,y)=>score(y)-score(x))[0]||null;
  if(_voice&&score(_voice)<0)_voice=vs[0];
  return _voice; }
if("speechSynthesis" in window) speechSynthesis.addEventListener?.("voiceschanged",()=>{_voice=null;pickVoice();});
function narrCancel(){ try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
  if(master&&AC) master.gain.setTargetAtTime(0.45,AC.currentTime,0.3); }
function humanize(t){ return t                                   // things TTS reads badly, said the human way
  .replace(/renderer-mutated-sim-state/g,"renderer mutated sim state")
  .replace(/offered-not-assigned/g,"offered, not assigned")
  .replace(/[✦♦★≡→]/g,"")
  .replace(/…/g,"...")
  .replace(/\u2014/g,",").replace(/ - /g,", ")
  .replace(/\b3D\b/g,"three dee")
  .replace(/\bNEW\b/g,"new").replace(/\bCHOOSE\b/g,"choose").replace(/\bOFFERS\b/g,"offers")
  .replace(/\bOTHER\b/g,"other").replace(/\bNOT\b/g,"not").replace(/\bOLD\b/g,"old")
  .replace(/\bMEMORY\b/g,"Memory").replace(/\bIDEAS\b/g,"Ideas").replace(/\bFOR\b/g,"for"); }
function speak(txt){ if(!narrOn||REDUCE||!("speechSynthesis" in window))return;
  try{ speechSynthesis.cancel(); _spkAt=performance.now();
    const clean=humanize(txt);
    const parts=(clean.match(/[^.!?]+[.!?]+['"]?/g)||[clean]).map(p=>p.trim()).filter(Boolean);
    const v=pickVoice();
    parts.forEach((p,i)=>{                                          // sentence-by-sentence: pauses + varied delivery
      const u=new SpeechSynthesisUtterance(p);
      if(v)u.voice=v;
      const short=p.length<28;
      u.rate=(short?0.84:0.92)+(i*0.013)%0.04;                      // dramatic lines land slower
      u.pitch=/\?/.test(p)?1.07:(0.95+(p.length%5)*0.012);          // gentle, deterministic variation
      u.volume=1;
      if(i===0) u.onstart=()=>{ if(master&&AC) master.gain.setTargetAtTime(0.14,AC.currentTime,0.15); };
      if(i===parts.length-1) u.onend=()=>{ if(master&&AC) master.gain.setTargetAtTime(0.45,AC.currentTime,0.4); };
      speechSynthesis.speak(u);
    });
  }catch(e){} }
/* narration = the captions themselves, spoken as each appears */
const NARR=[];
SCENES.forEach((sc,i)=>sc.caps.forEach(c=>NARR.push({t:STARTS[i]+c.s,txt:c.txt+(c.sub?" "+c.sub:"")})));
NARR.push({t:STARTS[SCENES.findIndex(s=>s.id==="title")]+1.4,
  txt:"The Sentence I Didn't Want to Write. A true story, told by the auditor who was sure. Gently dramatized."});
NARR.push({t:STARTS[SCENES.findIndex(s=>s.id==="credits")]+1.6,txt:"Thank you for watching. Cast your vote in the lobby."});
NARR.sort((x,y)=>x.t-y.t);

/* ============ player ============ */
let T=0,prevPad=null,playing=false,lastMs=0,scrubDrag=false,started=false;
function sceneAt(t){ let i=SCENES.length-1; for(let j=0;j<SCENES.length;j++) if(t<STARTS[j]+SCENES[j].dur){i=j;break;} return i; }
function drawFilm(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle="#000"; ctx.fillRect(0,0,cv.width,cv.height);
  const i=sceneAt(T), sc=SCENES[i], u=T-STARTS[i];
  apply(); sc.draw(warpU(sc,Math.min(u,sc.dur)));        // caption-pinned clock; holds final pose while text finishes
  const cap=sc.caps.find(c=>u>=c.s&&u<c.s+c.d);
  if(cap){ const a=fadeIO(u-cap.s,cap.d,0.45,0.6);
    if(cap.card) card(cap.txt,cap.sub,a); else drawCaption(cap.txt,a); }
  grainAndVignette(1); bars();
  apply(); ctx.textAlign="left"; ctx.fillStyle="rgba(184,188,198,.65)"; ctx.font="11px Georgia,serif";
  ctx.fillText(sc.name,16,DES_H-LBAR+30);
}
let _spkAt=0;
function tick(ms){ const dt=Math.min(0.05,(ms-lastMs)/1000||0); lastMs=ms;
  if(playing&&T<DUR){ const pT=T; let step=dt;
    if(narrOn&&("speechSynthesis" in window)&&speechSynthesis.speaking&&performance.now()-_spkAt<25000){
      const i=sceneAt(T); let stop=STARTS[i]+SCENES[i].dur-0.12;      // never cut a scene or start the next line mid-sentence
      for(const n of NARR){ if(n.t>pT+0.01){ stop=Math.min(stop,n.t-0.06); break; } }
      if(T+step>stop) step=Math.max(0,stop-T);
    }
    T+=step;
    for(const b of BEATS) if(pT<b.t&&T>=b.t){ try{b.f();}catch(e){} }
    for(const n of NARR) if(pT<n.t&&T>=n.t) speak(n.txt);
    const i=sceneAt(T), pad=SCENES[i].pad;
    if(pad!==prevPad){ prevPad=pad; try{ chord(PADS[pad]||PADS.title,3.2,0.22,"sine"); }catch(e){} }
    if(SCENES[i].id==="change"||SCENES[i].id==="credits"){ try{localStorage.setItem("srv_watched_film","1");}catch(e){} }
    if(T>=DUR){ T=DUR; playing=false; $("play").textContent="↻"; narrCancel(); }
  }
  drawFilm(); syncUI(); requestAnimationFrame(tick);
}
function fmt(t){ const m=(t/60)|0, s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0"); }
function syncUI(){ $("time").textContent=fmt(T)+" / "+fmt(DUR); if(!scrubDrag)$("scrub").value=Math.round(T/DUR*1000); }
$("play").onclick=()=>{ if(T>=DUR)T=0; playing=!playing; $("play").textContent=playing?"⏸":"▶"; if(!playing)narrCancel(); };
$("prev").onclick=()=>{ narrCancel(); const i=sceneAt(Math.max(0,T-0.5)); T=STARTS[Math.max(0,T-STARTS[i]<1?i-1:i)]; };
$("next").onclick=()=>{ narrCancel(); const i=sceneAt(T); if(i<SCENES.length-1)T=STARTS[i+1]; };
$("mute").onclick=()=>{ muted=!muted; $("mute").textContent=muted?"🔇":"🔊"; };
$("narr").onclick=()=>{ narrOn=!narrOn; $("narr").style.opacity=narrOn?1:0.4; if(!narrOn)narrCancel(); };
$("scrub").addEventListener("input",e=>{ scrubDrag=true; narrCancel(); T=e.target.value/1000*DUR; drawFilm(); });
$("scrub").addEventListener("change",()=>{ scrubDrag=false; });
STARTS.forEach((s,i)=>{ if(i===0)return; const el=document.createElement("i"); el.style.left=(s/DUR*100)+"%"; $("chap").appendChild(el); });
$("gatesub").textContent="a narrated short film · ~"+Math.round(DUR/60)+" min · no homework required — it explains everything";
$("begin").onclick=()=>{ $("gate").style.display="none"; audioInit(); pickVoice(); started=true;
  if(REDUCE){ T=STARTS[STARTS.length-2]; drawFilm(); playing=false; $("play").textContent="▶";
    try{localStorage.setItem("srv_watched_film","1");}catch(e){} }
  else { T=0; playing=true; } };
window.__film={ seek:t=>{T=t;drawFilm();}, dur:()=>DUR, scene:()=>SCENES[sceneAt(T)].id,
  cap:()=>{ const i=sceneAt(T),sc=SCENES[i],u=T-STARTS[i]; const c=sc.caps.find(c=>u>=c.s&&u<c.s+c.d); return c?c.txt.slice(0,44):null; },
  state:()=>({T,DUR,playing}) };
requestAnimationFrame(tick);
</script>
